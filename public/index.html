<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Pro Enterprise</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#1E40AF', secondary: '#3B82F6' } } } }
    </script>
</head>
<body class="bg-gray-50 font-sans">
    <nav class="bg-primary text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">School Pro Enterprise</h1>
            <div class="space-x-4">
                <button onclick="render('students')" class="hover:text-blue-200">Siswa</button>
                <button onclick="render('teachers')" class="hover:text-blue-200">Guru</button>
                <button onclick="render('attendance')" class="hover:text-blue-200">Absensi</button>
            </div>
        </div>
    </nav>

    <main id="app" class="container mx-auto p-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
            <h2 id="view-title" class="text-2xl font-bold text-primary mb-4">Dashboard</h2>
            <div id="content">Memuat data...</div>
        </div>
    </main>

    <script>
        const API_URL = '/api';
        async function render(entity) {
            document.getElementById('view-title').innerText = entity.toUpperCase();
            const res = await fetch(`${API_URL}/${entity}`);
            const data = await res.json();
            const container = document.getElementById('content');
            container.innerHTML = `
                <table class="w-full text-left border-collapse">
                    <thead><tr class="border-b bg-gray-50">${Object.keys(data[0] || {}).map(k => `<th class="p-3">${k}</th>`).join('')}</tr></thead>
                    <tbody>${data.map(row => `<tr class="border-b hover:bg-gray-50">${Object.values(row).map(v => `<td class="p-3">${v}</td>`).join('')}</tr>`).join('')}</tbody>
                </table>
            `;
        }
        render('students');
    </script>
</body>
</html>
